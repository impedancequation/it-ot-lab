global:
  scrape_interval: 30s

scrape_configs:
  - job_name: snmp
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [lab_v2]
    static_configs:
      - targets: ['192.168.56.11', '192.168.56.12']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9116
